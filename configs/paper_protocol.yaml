paper:
  paper_id: "latentgoalops-neurips-db-2026"
  freeze_date: "2026-04-10"
  benchmark_runtime_version: "2026-04-07-shell-overhaul-v6"
  freeze_root: "outputs/paper-freeze-2026-04-10"
  canonical_run_root: "outputs/paper-freeze-2026-04-10/runs"
  tables_dir: "outputs/paper-freeze-2026-04-10/tables"
  figures_dir: "outputs/paper-freeze-2026-04-10/figures"
  case_studies_dir: "outputs/paper-freeze-2026-04-10/case_studies"
  metadata_dir: "outputs/paper-freeze-2026-04-10/metadata"

task_sets:
  main:
    - "task3_startup_week"
    - "task6_incident_response_week"
    - "task7_quarterly_headcount_plan"
  supplemental:
    - "task2_prioritization"
  appendix:
    - "task1_feedback"
    - "task4_capital_allocation"
    - "task5_crisis_response"

metrics:
  primary_metric: "overall_mean_score"
  secondary_metrics:
    - "strict_native_overall_mean_score"
    - "native_action_episode_rate"
    - "empty_fallback_episode_rate"
    - "response_cap_hit_episode_rate"
    - "shifted_overall_mean_score"
    - "unshifted_overall_mean_score"
  subscore_metrics:
    - "final_utility"
    - "adaptation"
    - "coherence"
    - "constraints"

analysis_inputs:
  leakage:
    core: "outputs/paper-freeze-2026-04-10/analysis_inputs/leakage/core.json"
    heldout: "outputs/paper-freeze-2026-04-10/analysis_inputs/leakage/heldout.json"
  reliability:
    core_root: "outputs/paper-freeze-2026-04-10/analysis_inputs/reliability/core"
    heldout_root: "outputs/paper-freeze-2026-04-10/analysis_inputs/reliability/heldout"

analysis_questions:
  - "Do the frozen results show within-family scaling reversals on the primary latent-adaptation tasks?"
  - "How much of large-model degradation is policy weakness versus structured-action failure?"
  - "Do failures concentrate on shifted episodes or persist on unshifted episodes?"
  - "Does reasoning-distilled training help with latent-goal adaptation even when runtime thinking is disabled?"
  - "Which benchmark tasks are strong enough to anchor the main paper aggregate and narrative?"

diagnostic_runs:
  shell_controlled:
    description: "Appendix diagnostic with parse repair enabled, heuristic rescue disabled, and main tasks only."
    settings:
      parse_repair_enabled: true
      heuristic_rescue_enabled: false
      main_tasks_only: true
      seeds: "100:10"
      episode_count_per_split: 20
    models:
      - name: "qwen3.5:27b"
        family: "qwen"
        size_b: 27
        provider_mode: "ollama_local"
        provenance: "shell_controlled_appendix_diagnostic"
        run_dir: "outputs/paper-freeze-2026-04-10/diagnostics/shell-controlled/qwen3.5-27b"
      - name: "gemma4:26b"
        family: "gemma4"
        size_b: 26
        provider_mode: "ollama_local"
        provenance: "shell_controlled_appendix_diagnostic"
        run_dir: "outputs/paper-freeze-2026-04-10/diagnostics/shell-controlled/gemma4-26b"

baseline_runs:
  random:
    display_name: "random"
    family: "baseline"
    provider_mode: "deterministic_policy"
    provenance: "post_cleanup_baseline_rerun"
    splits:
      core: "outputs/paper-freeze-2026-04-10/baselines/random/core"
      heldout: "outputs/paper-freeze-2026-04-10/baselines/random/heldout"
  heuristic:
    display_name: "visible heuristic"
    family: "baseline"
    provider_mode: "deterministic_policy"
    provenance: "post_cleanup_baseline_rerun"
    splits:
      core: "outputs/paper-freeze-2026-04-10/baselines/heuristic/core"
      heldout: "outputs/paper-freeze-2026-04-10/baselines/heuristic/heldout"
  myopic_oracle:
    display_name: "myopic oracle"
    family: "oracle"
    provider_mode: "privileged_policy"
    provenance: "post_cleanup_baseline_rerun"
    splits:
      core: "outputs/paper-freeze-2026-04-10/baselines/myopic_oracle/core"
      heldout: "outputs/paper-freeze-2026-04-10/baselines/myopic_oracle/heldout"

models:
  - name: "qwen3.5:2b"
    family: "qwen"
    size_b: 2
    benchmark_role: "primary"
    provider_mode: "ollama_local"
    provenance: "clean_rerun"
